name: Publish Foundry Module

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Release by tag or main-branch commit named release: vX.Y.Z (optional letter suffix).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            message="$(git log -1 --format=%s)"
            if [[ "$message" =~ ^release:\ (v[0-9]+\.[0-9]+\.[0-9]+[a-z]?)$ ]]; then
              echo "RELEASE_TAG=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            else
              echo "Invalid release commit title: $message" >&2
              exit 1
            fi
          fi
      - name: Validate JavaScript syntax
        run: find scripts -name '*.mjs' -exec node --check {} \;
      - name: Validate release behavior
        run: node --test tools/tests/*.test.mjs
      - name: Build release
        run: python3 tools/build_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --out dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/module.zip
            dist/module.json
          fail_on_unmatched_files: true
          generate_release_notes: true
