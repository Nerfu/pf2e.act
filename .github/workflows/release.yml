name: Publish Foundry Module

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # The main-branch release marker is used once for the initial publication.
    # Later versions are released by pushing version tags as usual.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.1.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.1.0" >> "$GITHUB_ENV"
          fi
      - name: Validate JavaScript syntax
        run: find scripts -name '*.mjs' -exec node --check {} \;
      - name: Build release
        run: python3 tools/build_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --out dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/module.zip
            dist/module.json
          fail_on_unmatched_files: true
          generate_release_notes: true
