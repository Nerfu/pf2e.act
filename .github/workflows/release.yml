name: Publish Foundry Module
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: find scripts -name '*.mjs' -exec node --check {} \;
      - name: Build release
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/build_release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --out dist
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.zip
            dist/module.json
          generate_release_notes: true
